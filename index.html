<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IPv6 connectivity test site for Hurricane Electric certification.">
  <title>IPv6 Lab | misuminitt</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1220;
      color: #edf4ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      border: 1px solid #23324a;
      border-radius: 18px;
      background: #111c2e;
      text-align: center;
    }
    .label { color: #73e1d1; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 16px 0 12px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    p { color: #aabbd2; line-height: 1.7; }
    code { color: #d9f8f3; overflow-wrap: anywhere; }
    footer { margin-top: 32px; color: #8295ac; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <div class="label">Hurricane Electric IPv6 Certification</div>
    <h1>IPv6 Test Lab</h1>
    <p>Static website for IPv6 connectivity and HTTP verification tests.</p>
    <p>Host: <code>he.2arah.web.id</code></p>
    <footer>Maintained by misuminitt</footer>
  </main>
</body>
</html>
